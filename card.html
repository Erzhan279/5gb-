<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass Card</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-glass: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.15);
            --accent: #6366f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .hint {
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* --- Realistic Card UI --- */
        .card-container {
            perspective: 1000px;
            width: 440px;
            height: 270px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px) rotateX(2deg);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.2);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chip {
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .visa-logo {
            font-style: italic;
            font-weight: bold;
            font-size: 1.5rem;
            opacity: 0.8;
        }

        /* --- Card Inputs Styling --- */
        .card input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            font-size: 1rem;
            outline: none;
            padding: 5px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .card input:hover, .card input:focus {
            background: rgba(255, 255, 255, 0.05);
        }

        .number-input {
            font-size: 1.6rem !important;
            letter-spacing: 4px;
            margin-top: 20px;
            text-align: center;
        }

        .bottom-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            align-items: flex-end;
        }

        .label {
            font-size: 0.65rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        .name-input {
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .expiry-input, .cvv-input {
            text-align: center;
        }

        /* --- Footer --- */
        footer {
            margin-top: 40px;
            color: #4b5563;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Chrome, Safari, Edge, Opera - Remove arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="hint">Click on details to edit</div>

    <div class="card-container">
        <div class="card" id="card">
            <div class="card-top">
                <div class="chip"></div>
                <div class="visa-logo">VISA</div>
            </div>

            <div class="number-section">
                <span class="label">Card Number</span>
                <input type="text" class="number-input" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>

            <div class="bottom-row">
                <div class="info">
                    <span class="label">Card Holder</span>
                    <input type="text" class="name-input" id="cardName" placeholder="NAME SURNAME" maxlength="22">
                </div>
                <div class="info">
                    <span class="label">Expires</span>
                    <input type="text" class="expiry-input" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="info">
                    <span class="label">CVV</span>
                    <input type="password" class="cvv-input" id="cardCvv" placeholder="***" maxlength="3">
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2025 | Құқық қорғалған
    </footer>

    <script>
        const cardNumber = document.getElementById('cardNumber');
        const cardName = document.getElementById('cardName');
        const cardExpiry = document.getElementById('cardExpiry');
        const cardCvv = document.getElementById('cardCvv');

        // Number Formatting (0000 0000 0000 0000)
        cardNumber.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); // Тек сандар
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += value[i];
            }
            e.target.value = formatted;
        });

        // Name Formatting (Uppercase)
        cardName.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        // Expiry Formatting (MM/YY)
        cardExpiry.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 2) {
                e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4);
            } else {
                e.target.value = value;
            }
        });

        // CVV - Тек сандар
        cardCvv.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Картаның қозғалыс эффектісі (Mouse Tilt)
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Тышқан картадан шыққанда орнына келуі
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
