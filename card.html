<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Card Checkout</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --input-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            perspective: 1000px;
        }

        /* --- Realistic Card UI --- */
        .card-visual {
            width: 100%;
            height: 250px;
            background: var(--card-gradient);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: -100px; /* Overlap effect */
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .card-visual::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .chip {
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #fde68a 0%, #f59e0b 100%);
            border-radius: 8px;
            position: relative;
        }

        .card-number-display {
            font-size: 1.6rem;
            letter-spacing: 3px;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            min-height: 1.6em;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .label-small {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 4px;
        }

        .value-text {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Form Styling --- */
        .card-form {
            background: #1e293b;
            padding: 120px 40px 40px 40px;
            border-radius: 24px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* --- Footer --- */
        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="card-visual" id="cardContainer">
            <div class="card-top">
                <div class="chip"></div>
            </div>
            
            <div class="card-number-display" id="disp-number">#### #### #### ####</div>
            
            <div class="card-bottom">
                <div class="info-group">
                    <p class="label-small">Card Holder</p>
                    <p class="value-text" id="disp-name">YOUR NAME</p>
                </div>
                <div class="info-group" style="text-align: right;">
                    <p class="label-small">Expires</p>
                    <p class="value-text" id="disp-expiry">MM/YY</p>
                </div>
                <div class="info-group" style="text-align: right; margin-left: 20px;">
                    <p class="label-small">CVV</p>
                    <p class="value-text" id="disp-cvv">***</p>
                </div>
            </div>
        </div>

        <form class="card-form">
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>

            <div class="form-group">
                <label for="card-name">Card Holder Name</label>
                <input type="text" id="card-name" placeholder="FULL NAME" maxlength="25">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="card-expiry">Expiry Date</label>
                    <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group">
                    <label for="card-cvv">CVV</label>
                    <input type="text" id="card-cvv" placeholder="123" maxlength="3">
                </div>
            </div>
        </form>
    </div>

    <footer>
        © 2025 | Құқық қорғалған
    </footer>

    <script>
        const inputNumber = document.getElementById('card-number');
        const inputName = document.getElementById('card-name');
        const inputExpiry = document.getElementById('card-expiry');
        const inputCvv = document.getElementById('card-cvv');

        const dispNumber = document.getElementById('disp-number');
        const dispName = document.getElementById('disp-name');
        const dispExpiry = document.getElementById('disp-expiry');
        const dispCvv = document.getElementById('disp-cvv');

        // Format and Sync Card Number
        inputNumber.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
            e.target.value = formatted;
            dispNumber.textContent = formatted || '#### #### #### ####';
        });

        // Sync Name (Uppercase)
        inputName.addEventListener('input', (e) => {
            let value = e.target.value.toUpperCase();
            e.target.value = value;
            dispName.textContent = value || 'YOUR NAME';
        });

        // Format and Sync Expiry (MM/YY)
        inputExpiry.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
            dispExpiry.textContent = value || 'MM/YY';
        });

        // Sync CVV
        inputCvv.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            e.target.value = value;
            dispCvv.textContent = value || '***';
        });

        // Slight Tilt effect on focus
        const inputs = [inputNumber, inputName, inputExpiry, inputCvv];
        const card = document.getElementById('cardContainer');

        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                card.style.transform = 'scale(1.05) translateY(-10px)';
            });
            input.addEventListener('blur', () => {
                card.style.transform = 'scale(1) translateY(0)';
            });
        });
    </script>
</body>
</html>
