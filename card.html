<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Premium Card</title>
    <style>
        :root {
            --bg: #050505;
            --card-gradient: linear-gradient(135deg, #1e1e1e 0%, #111111 100%);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-color: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Көмекші мәтін */
        .hint {
            margin-bottom: 30px;
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Карта контейнері */
        .card {
            width: 420px;
            height: 260px;
            background: var(--card-gradient);
            border-radius: 24px;
            position: relative;
            padding: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: text;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
        }

        /* Карта элементтерінің стилі */
        .chip {
            width: 55px;
            height: 42px;
            background: linear-gradient(135deg, #e2e2e2 0%, #999 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .chip::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px), 
                              linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* Жазатын жерлер */
        .editable {
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s;
            outline: none;
            display: inline-block;
        }

        .editable:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .editable:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-number {
            font-size: 1.8rem;
            letter-spacing: 4px;
            font-weight: 500;
            color: #eee;
            margin-top: 10px;
            width: 100%;
        }

        .bottom-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .value {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Сәндік элементтер */
        .logo-circle {
            position: absolute;
            top: 35px;
            right: 35px;
            width: 50px;
            height: 50px;
            background: var(--accent-gradient);
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.7;
        }

        /* Футер */
        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 1px;
        }

        /* Placeholder стилі */
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #444;
        }
    </style>
</head>
<body>

    <div class="hint">Мәліметтерді енгізу үшін картаны басыңыз</div>

    <div class="card" id="card">
        <div class="logo-circle"></div>
        <div class="chip"></div>
        
        <div class="card-number-wrapper">
            <div class="label">Card Number</div>
            <div class="editable card-number" id="cardNo" contenteditable="true" data-placeholder="0000 0000 0000 0000"></div>
        </div>

        <div class="bottom-info">
            <div>
                <div class="label">Card Holder</div>
                <div class="editable value" id="cardHolder" contenteditable="true" data-placeholder="FULL NAME"></div>
            </div>

            <div style="display: flex; gap: 30px;">
                <div>
                    <div class="label">Expires</div>
                    <div class="editable value" id="expiry" contenteditable="true" data-placeholder="MM/YY"></div>
                </div>
                <div>
                    <div class="label">CVV</div>
                    <div class="editable value" id="cvv" contenteditable="true" data-placeholder="***"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>© 2025 | Құқық қорғалған</footer>

    <script>
        // Карта нөмірін форматтау (әр 4 символ сайын бос орын)
        document.getElementById('cardNo').addEventListener('input', function(e) {
            let cursorPosition = window.getSelection().getRangeAt(0).startOffset;
            let originalValue = this.innerText.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let formattedValue = '';

            for(let i = 0; i < originalValue.length; i++) {
                if(i > 0 && i % 4 === 0) formattedValue += ' ';
                if(i < 16) formattedValue += originalValue[i];
            }
            
            if(this.innerText !== formattedValue) {
                this.innerText = formattedValue;
                // Курсорды соңына қою
                let range = document.createRange();
                let sel = window.getSelection();
                range.setStart(this.childNodes[0] || this, this.innerText.length);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        });

        // Аты-жөнін бас әріпке айналдыру
        document.getElementById('cardHolder').addEventListener('input', function(e) {
            this.innerText = this.innerText.toUpperCase();
            if(this.innerText.length > 22) {
                this.innerText = this.innerText.substring(0, 22);
            }
        });

        // Мерзімді форматтау (MM/YY)
        document.getElementById('expiry').addEventListener('input', function(e) {
            let val = this.innerText.replace(/[^0-9]/g, '');
            if(val.length >= 2) {
                this.innerText = val.substring(0, 2) + '/' + val.substring(2, 4);
            } else {
                this.innerText = val;
            }
            
            if(this.innerText.length > 5) {
                this.innerText = this.innerText.substring(0, 5);
            }
        });

        // CVV шектеу (3 сан)
        document.getElementById('cvv').addEventListener('input', function(e) {
            let val = this.innerText.replace(/[^0-9]/g, '');
            this.innerText = val.substring(0, 3);
        });

        // Enter бассақ келесі жолға түспеуі үшін
        document.querySelectorAll('.editable').forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    el.blur();
                }
            });
        });
    </script>
</body>
</html>
