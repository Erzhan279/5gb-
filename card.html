<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Premium Card UI</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            /* Карта градиенті - заманауи күміс/қара металл стилі */
            --card-bg: linear-gradient(135deg, #232526 0%, #414345 100%);
            --accent-color: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .hint {
            margin-bottom: 30px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
        }

        /* --- Card Design --- */
        .card {
            width: 100%;
            max-width: 420px;
            height: 250px;
            background: var(--card-bg);
            border-radius: 20px;
            position: relative;
            padding: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5), 
                        inset 0 0 20px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* Картаның үстіндегі жарқыл (Gloss) */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chip {
            width: 50px;
            height: 38px;
            background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #b8860b 100%);
            border-radius: 6px;
            position: relative;
        }

        .visa-logo {
            font-size: 1.4rem;
            font-weight: 800;
            font-style: italic;
            opacity: 0.9;
            letter-spacing: -1px;
        }

        /* --- Inputs Styling --- */
        .input-group {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            padding: 5px 0;
            width: 100%;
            font-weight: 500;
            transition: all 0.3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        input:focus {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .number-input {
            font-size: 1.6rem;
            letter-spacing: 4px;
            text-align: center;
            margin: 15px 0;
        }

        .bottom-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
        }

        .name-input {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .expiry-input, .cvv-input {
            font-size: 0.9rem;
            text-align: center;
        }

        /* --- Footer --- */
        footer {
            margin-top: 50px;
            color: #333;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Анимация Focus кезінде */
        .card:has(input:focus) {
            transform: scale(1.03) translateY(-10px);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 60px 120px rgba(0,0,0,0.6);
        }

        @media (max-width: 480px) {
            .card {
                max-width: 350px;
                height: 220px;
                padding: 20px;
            }
            .number-input { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="hint">Мәліметтерді басып өзгертіңіз</div>

    <div class="card">
        <div class="card-top">
            <div class="chip"></div>
            <div class="visa-logo">VISA</div>
        </div>

        <div class="input-group">
            <span class="label">Card Number</span>
            <input type="text" id="cardNumber" class="number-input" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>

        <div class="bottom-row">
            <div class="input-group">
                <span class="label">Card Holder</span>
                <input type="text" id="cardHolder" class="name-input" placeholder="NAME SURNAME" maxlength="22">
            </div>
            <div class="input-group">
                <span class="label">Expires</span>
                <input type="text" id="cardExpiry" class="expiry-input" placeholder="MM/YY" maxlength="5">
            </div>
            <div class="input-group">
                <span class="label">CVV</span>
                <input type="password" id="cardCvv" class="cvv-input" placeholder="***" maxlength="3">
            </div>
        </div>
    </div>

    <footer>© 2025 | Құқық қорғалған</footer>

    <script>
        const cardNo = document.getElementById('cardNumber');
        const cardHolder = document.getElementById('cardHolder');
        const cardExpiry = document.getElementById('cardExpiry');
        const cardCvv = document.getElementById('cardCvv');

        // Нөмірді 4-тен бөліп жазу
        cardNo.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            let final = val.match(/.{1,4}/g)?.join(' ') || '';
            e.target.value = final;
        });

        // Есімді бас әріпке айналдыру
        cardHolder.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        // Мерзімді форматтау (MM/YY)
        cardExpiry.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 2) {
                e.target.value = val.substring(0, 2) + '/' + val.substring(2, 4);
            } else {
                e.target.value = val;
            }
        });

        // CVV тек сандар
        cardCvv.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Картаның қозғалысы (Жайлылық үшін)
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                const card = document.querySelector('.card');
                let x = (window.innerWidth / 2 - e.pageX) / 30;
                let y = (window.innerHeight / 2 - e.pageY) / 30;
                card.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
            }
        });
    </script>
</body>
</html>
