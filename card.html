<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Gold Card</title>
    <style>
        :root {
            --bg-color: #050505;
            /* Алтын түсті градиент (Brushed Gold) */
            --gold-gradient: linear-gradient(135deg, #a37e2c 0%, #fde08d 45%, #e1b141 55%, #8a6c24 100%);
            --card-text: #1a1a1a; /* Алтын бетінде қара мәтін жақсы көрінеді */
            --btn-bg: #e1b141;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        /* --- Card UI --- */
        .wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 250px;
            background: var(--gold-gradient);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 
                        inset 0 1px 1px rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--card-text);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        /* Металл жылтыры */
        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.3) 45%, rgba(255,255,255,0.3) 50%, transparent 55%);
            background-size: 200% 100%;
            animation: shine 5s infinite linear;
            pointer-events: none;
        }

        @keyframes shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .chip {
            width: 50px;
            height: 38px;
            background: linear-gradient(135deg, #333 0%, #000 100%);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .visa-logo {
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            opacity: 0.8;
        }

        /* --- Inputs --- */
        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        input {
            background: transparent;
            border: none;
            color: var(--card-text);
            outline: none;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
        }

        input::placeholder { color: rgba(0,0,0,0.3); }

        .number-input {
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-align: center;
            margin: 10px 0;
        }

        .bottom-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }

        .name-input { text-transform: uppercase; }

        /* --- Button --- */
        .pay-btn {
            width: 100%;
            padding: 18px;
            background: var(--btn-bg);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(225, 177, 65, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pay-btn:hover {
            transform: translateY(-3px);
            background: #fde08d;
            box-shadow: 0 15px 30px rgba(225, 177, 65, 0.4);
        }

        .pay-btn:active { transform: translateY(0); }

        /* --- Footer --- */
        footer {
            margin-top: 40px;
            color: #444;
            font-size: 0.8rem;
        }

        /* Focus эффект */
        .card:focus-within {
            transform: rotateX(5deg) scale(1.02);
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card" id="mainCard">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="chip"></div>
                <div class="visa-logo">VISA</div>
            </div>

            <div>
                <p class="label">Card Number</p>
                <input type="text" id="num" class="number-input" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>

            <div class="bottom-row">
                <div>
                    <p class="label">Card Holder</p>
                    <input type="text" id="name" class="name-input" placeholder="NAME SURNAME" maxlength="20">
                </div>
                <div>
                    <p class="label">Expiry</p>
                    <input type="text" id="exp" placeholder="MM/YY" maxlength="5" style="text-align: center;">
                </div>
                <div>
                    <p class="label">CVV</p>
                    <input type="password" id="cvv" placeholder="***" maxlength="3" style="text-align: center;">
                </div>
            </div>
        </div>

        <button class="pay-btn" onclick="alert('Төлем өңделуде...')">Оплатить</button>
    </div>

    <footer>© 2025 | Құқық қорғалған</footer>

    <script>
        // Formatter Logic
        const num = document.getElementById('num');
        const exp = document.getElementById('exp');
        const nameInput = document.getElementById('name');

        num.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            e.target.value = v.match(/.{1,4}/g)?.join(' ') || '';
        });

        exp.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if(v.length >= 2) v = v.substring(0,2) + '/' + v.substring(2,4);
            e.target.value = v;
        });

        nameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        // 3D Tilt Effect
        const card = document.getElementById('mainCard');
        document.addEventListener('mousemove', (e) => {
            let ax = (window.innerWidth / 2 - e.pageX) / 40;
            let ay = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${-ax}deg) rotateX(${ay}deg)`;
        });
    </script>
</body>
</html>
